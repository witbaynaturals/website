# Nginx configuration for witbaynaturals
# HTTPS redirect and caching

server {
    listen 80;
    server_name witbaynaturals.com www.witbaynaturals.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name witbaynaturals.com www.witbaynaturals.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/witbaynaturals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witbaynaturals.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory
    root /var/www/witbaynaturals;
    index index.html;

    # Cache static assets
    location ~* \.(webp|jpg|jpeg|png|gif|ico|css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML - no cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service Worker
    location /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Main page
    location / {
        try_files $uri $uri/ /sample.html;
    }
}
